name: CI/CD

on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) Lint + production build — fail fast before we build/push an image.
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Run build
        # NEXT_PUBLIC_* is inlined into the client bundle at build time; the other
        # keys are only used at request time so they aren't needed here.
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  # 2) Build the Docker image and push it to Docker Hub.
  build-and-push:
    name: Build & Push image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/askpdf:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/askpdf:${{ github.sha }}
          # NEXT_PUBLIC_* must be present at image build time (inlined into the
          # client bundle). Runtime secrets are injected from .env on the VM.
          build-args: |
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/askpdf:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/askpdf:buildcache,mode=max

  # 3) SSH into the VM and roll out the new image via docker compose.
  deploy:
    name: Deploy to VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          # envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -e
            # Log in so a private Docker Hub repo can be pulled (harmless if public).
            # echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            # ~/askpdf must contain compose.yml and a .env with the runtime secrets.
            cd ~/askpdf
            docker compose pull app
            docker compose up -d app
            docker compose ps
            docker image prune -f
